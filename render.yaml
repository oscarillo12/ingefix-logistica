services:
  - type: web
    name: ingefix-control-logistico
    runtime: python
    plan: free
    buildCommand: "python --version"
    startCommand: "python app/server.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: INGEFIX_FRONTEND_ORIGIN
        value: https://ingefix-control-logistico-ui.onrender.com
  - type: web
    name: ingefix-control-logistico-ui
    runtime: static
    buildCommand: "echo Publishing INGEFIX static interface"
    staticPublishPath: app/static
    routes:
      - type: rewrite
        source: /bodega
        destination: /index.html
