services:
  - type: web
    name: ingefix-control-logistico
    runtime: python
    plan: starter
    buildCommand: "python --version"
    startCommand: "python app/server.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    disk:
      name: ingefix-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: INGEFIX_DB_PATH
        value: /var/data/ingefix.db
